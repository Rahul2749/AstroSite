# Public HTTP test site. Admin traffic is served only by the loopback gateway.
server {
    listen 80;
    server_name _;
    client_max_body_size 128k;
    add_header X-Robots-Tag "noindex, nofollow" always;
    location ~ ^/(admin|api/admin)(/|$) { return 403; }
    location /api/ {
        proxy_pass http://api:5100;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto http;
        proxy_read_timeout 30s;
    }
    location / {
        proxy_pass http://frontend:3100;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto http;
    }
}

# Port 81 is published ONLY to 127.0.0.1:8081 on the VPS by Compose.
server {
    listen 81;
    server_name _;
    client_max_body_size 128k;
    add_header X-Robots-Tag "noindex, nofollow" always;
