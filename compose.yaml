name: veda
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - veda_postgres:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 12
    logging: &logging
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  migrate:
    build: ./backend
    image: veda-backend:local
    env_file: docker.env
    environment: &backend-environment
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "5100"
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      TRUST_PROXY_HOPS: "1"
    depends_on:
      db: { condition: service_healthy }
    command: [node, dist/scripts/migrate.js]
    logging: *logging

  api:
    build: ./backend
    image: veda-backend:local
    restart: unless-stopped
    env_file: docker.env
    environment: *backend-environment
    depends_on:
      migrate: { condition: service_completed_successfully }
    ports: ["127.0.0.1:5100:5100"]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:5100/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging: *logging

  worker:
    build: ./backend
    image: veda-backend:local
    restart: unless-stopped
    stop_grace_period: 45s
    env_file: docker.env
    environment: *backend-environment
    depends_on:
      migrate: { condition: service_completed_successfully }
    command: [node, dist/worker.js]
    logging: *logging

  frontend:
    build: .
    restart: unless-stopped
    depends_on:
      api: { condition: service_healthy }
    ports: ["127.0.0.1:3100:3100"]
    logging: *logging

volumes:
  veda_postgres:
