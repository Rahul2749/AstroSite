# Use together with compose.yaml. This adds an isolated HTTP test gateway.
services:
  gateway:
    image: nginx:stable-alpine
    restart: unless-stopped
    depends_on:
      api: { condition: service_healthy }
      frontend: { condition: service_started }
    ports:
      - "0.0.0.0:${TEST_PORT:-8080}:80"
      - "127.0.0.1:${ADMIN_TUNNEL_PORT:-8081}:81"
    volumes:
      - ./deploy/nginx/ip-test.conf:/etc/nginx/conf.d/default.conf:ro
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
